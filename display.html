<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>East Campus - GCs On Site</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 30px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

h1 {
  font-size: 38px;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 18px;
  color: #555;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 30px;
}

.stat {
  background: white;
  padding: 18px 35px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.statNumber {
  font-size: 38px;
  font-weight: bold;
}

.statLabel {
  font-size: 15px;
  color: #555;
}

.board {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #eeeeee;
  padding: 16px;
  text-align: left;
  font-size: 17px;
}

td {
  padding: 16px;
  border-bottom: 1px solid #dddddd;
  font-size: 17px;
}

.gcName {
  font-weight: bold;
  font-size: 18px;
}

.status {
  display: inline-block;
  padding: 7px 13px;
  border-radius: 20px;
  font-weight: bold;
}

.working {
  background: #fff3cd;
}

.complete {
  background: #dff3e4;
}

.empty {
  text-align: center;
  padding: 50px;
  font-size: 22px;
  color: #777;
}

.footer {
  text-align: center;
  color: #777;
  margin-top: 20px;
  font-size: 14px;
}

</style>
</head>


<body>

<div class="header">

  <h1>East Campus</h1>

  <div class="subtitle">
    GCs On Site Today
  </div>

</div>


<div class="stats">

  <div class="stat">

    <div
      class="statNumber"
      id="onsiteCount">

      0

    </div>

    <div class="statLabel">
      GCs On Site
    </div>

  </div>


  <div class="stat">

    <div
      class="statNumber"
      id="completeCount">

      0

    </div>

    <div class="statLabel">
      Goals Complete
    </div>

  </div>

</div>


<div class="board">

<table>

<thead>

<tr>

  <th>GC</th>

  <th>Arrived</th>

  <th>Working On</th>

  <th>Today's Goal</th>

  <th>Status</th>

</tr>

</thead>


<tbody id="gcTable">

</tbody>

</table>


<div
  id="emptyMessage"
  class="empty"
  style="display:none;">

  No GCs are currently checked in.

</div>

</div>


<div class="footer">

  This board updates automatically.

</div>



<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>


<script>


const firebaseConfig = {

  apiKey: "PASTE YOUR REAL API KEY HERE",

  authDomain: "east-campus-onsite.firebaseapp.com",

  databaseURL: "https://east-campus-onsite-default-rtdb.firebaseio.com/",

  projectId: "east-campus-onsite",

  storageBucket: "east-campus-onsite.firebasestorage.app",

  messagingSenderId: "276442458258",

  appId: "1:276442458258:web:8469031b939c462971de4b",

  measurementId: "G-VTJ54LN5G5"

};


firebase.initializeApp(firebaseConfig);

const database =
  firebase.database();



function isToday(timestamp) {

  const date =
    new Date(timestamp);

  const today =
    new Date();


  return (

    date.getFullYear() === today.getFullYear() &&

    date.getMonth() === today.getMonth() &&

    date.getDate() === today.getDate()

  );

}



function formatTime(timestamp) {

  if (!timestamp) {

    return "—";

  }


  return new Date(timestamp)
    .toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

}



function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}



function displayName(fullName) {

  const parts =
    fullName.trim().split(" ");


  if (parts.length === 1) {

    return parts[0];

  }


  const firstName =
    parts[0];


  const lastInitial =
    parts[parts.length - 1]
      .charAt(0)
      .toUpperCase();


  return firstName + " " + lastInitial + ".";

}



database
.ref("checkins")
.on("value", snapshot => {


  const table =
    document.getElementById("gcTable");


  const emptyMessage =
    document.getElementById("emptyMessage");


  table.innerHTML = "";


  let onsite = 0;

  let completed = 0;


  const records = [];


  snapshot.forEach(child => {


    const gc =
      child.val();


    if (

      gc.arrivalTime &&

      isToday(gc.arrivalTime) &&

      gc.status === "On Site"

    ) {

      records.push(gc);

    }

  });



  records.sort(

    (a, b) =>
      a.arrivalTime - b.arrivalTime

  );



  records.forEach(gc => {


    onsite++;


    if (
      gc.complete === true
    ) {

      completed++;

    }


    const row =
      document.createElement("tr");


    const statusHTML =
      gc.complete === true

      ?

      `<span class="status complete">
        ✓ Goal Complete
      </span>`

      :

      `<span class="status working">
        Working
      </span>`;



    row.innerHTML = `

      <td class="gcName">

        ${escapeHTML(
          displayName(gc.studentName)
        )}

      </td>


      <td>

        ${formatTime(
          gc.arrivalTime
        )}

      </td>


      <td>

        ${escapeHTML(
          gc.workType || ""
        )}

      </td>


      <td>

        ${escapeHTML(
          gc.goal || ""
        )}

      </td>


      <td>

        ${statusHTML}

      </td>

    `;


    table.appendChild(row);

  });



  document
    .getElementById("onsiteCount")
    .innerText = onsite;


  document
    .getElementById("completeCount")
    .innerText = completed;



  if (onsite === 0) {

    emptyMessage.style.display =
      "block";

  }

  else {

    emptyMessage.style.display =
      "none";

  }


});

</script>

</body>

</html>
